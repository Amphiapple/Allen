[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Change boss blind size
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = "self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling"
position = 'after'
payload = '''
if G.GAME.modifiers.safecracking and self.boss then
    self.chips = self.chips * 5
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = 'after'
payload = '''
if G.GAME.modifiers.safecracking and type == 'Boss' then
    blind_amt = blind_amt * 5
end
'''
match_indent = true
