[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Force The Luchador boss
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "if G.FORCE_BOSS then return G.FORCE_BOSS end"
position = 'after'
payload = '''
if G.GAME.modifiers.critical_hit_1 then
    return "bl_allen_luchador"
end
'''
match_indent = true
